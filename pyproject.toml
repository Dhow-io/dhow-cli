[build-system]
requires = ["setuptools >=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhow-cli"
version = "0.2.0"
description = "Command-line interface for the Dhow metadata-driven declarative ERP framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dhow Contributors"}
]
keywords = ["erp", "cli", "metadata", "declarative", "ai", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "dhow>=0.2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/Dhow-io/dhow-cli"
Repository = "https://github.com/Dhow-io/dhow-cli"
Issues = "https://github.com/Dhow-io/dhow-cli/issues"

[project.scripts]
dhow = "dhow_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhow_cli = ["py.typed", "resources/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=dhow_cli --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
